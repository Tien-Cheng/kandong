name: Release

# Push a tag like v0.1.0 to build, sign and publish Kandong-0.1.0.zip as a GitHub Release, then
# point the Homebrew cask at it. Tags with a "-" (v0.2.0-beta.1) skip the cask. See RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    # A stalled test otherwise holds the release for GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: scripts/fetch-data.sh
      - run: swift test
      - name: Import signing identity
        run: scripts/import-signing-identity.sh
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
      - name: Build Kandong.app
        run: scripts/build-app.sh
        env:
          SIGN_IDENTITY: Kandong Self-Signed
          KANDONG_VERSION: ${{ github.ref_name }}
      - name: Package
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip="Kandong-$version.zip"
          ditto -c -k --keepParent build/Kandong.app "$zip"
          shasum -a 256 "$zip" > "$zip.sha256"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
      - name: Sign the update for Sparkle
        # Installed copies update from releases/latest/download/appcast.xml; prereleases get none.
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          ZIP: ${{ steps.package.outputs.zip }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          curl -fsSL -o sparkle.tar.xz https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
          echo "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  sparkle.tar.xz" | shasum -a 256 -c --quiet
          mkdir sparkle && tar -xJf sparkle.tar.xz -C sparkle
          key="$RUNNER_TEMP/sparkle.key"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$key"
          repo="https://github.com/${GITHUB_REPOSITORY}/releases"
          SIGN_UPDATE=sparkle/bin/sign_update SPARKLE_KEY_FILE="$key" scripts/make-appcast.sh build/Kandong.app "$ZIP" \
            "$repo/download/$GITHUB_REF_NAME/$ZIP" "$repo/tag/$GITHUB_REF_NAME" > appcast.xml
          rm -f "$key"
          cat appcast.xml
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          cat > notes.md <<'NOTES'
          ## Install

          1. Unzip and move **Kandong.app** to Applications.
          2. Open it once. macOS blocks it because it isn't notarized, so go to **System Settings → Privacy & Security** and click **Open Anyway**.
          3. Grant **Accessibility** when asked (and **Screen Recording** for region capture).

          Updating: Kandong 0.4.0 and later update themselves (menu bar → Check for Updates…). For earlier versions, quit Kandong and replace the app. Permissions carry over between releases.

          Needs macOS 26+ (on macOS 26, screenshots are read with on-device OCR). Translations use Apple Intelligence on this Mac by default; you can also connect an eligible ChatGPT plan with **AI → ChatGPT → Continue with ChatGPT**, or use [LM Studio](https://lmstudio.ai) and other OpenAI-compatible backends.
          NOTES
          prerelease=() appcast=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          [[ -f appcast.xml ]] && appcast=(appcast.xml)
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" "${appcast[@]}" "${prerelease[@]}" \
            --title "Kandong ${GITHUB_REF_NAME}" --notes-file notes.md --generate-notes --verify-tag
      - name: Check out the Homebrew tap
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/checkout@v5
        with:
          repository: Tien-Cheng/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: homebrew-tap
      - name: Update the cask
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha="$(shasum -a 256 "$ZIP" | cut -d' ' -f1)"
          cd homebrew-tap
          sed -i '' -E "s/^  version \".*\"/  version \"$version\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/kandong.rb
          # Builds need macOS 26 (Apple Intelligence's Foundation Models) and translate out of the box.
          sed -i '' -E "s/^  depends_on macos: .*/  depends_on macos: :tahoe/" Casks/kandong.rb
          # Kandong updates itself (Sparkle), so brew shouldn't count it as outdated.
          grep -q '^  auto_updates true' Casks/kandong.rb || perl -pi -e 's/^(  depends_on macos: .*)$/  auto_updates true\n$1/' Casks/kandong.rb
          sed -i '' -E "s/^    Translations .*/    Translations use Apple Intelligence (turn it on in System Settings); ChatGPT and LM Studio also work./" Casks/kandong.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "kandong $version"
          git push
